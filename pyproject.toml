[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-bump"
version = "1.0.0"
description = "Bump Semantic Versions across your project files — with optional git commit and tag"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "someone-rs" }]
requires-python = ">=3.9"
keywords = ["semver", "version", "bump", "release", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/someone-rs/semver-bump"
Repository = "https://github.com/someone-rs/semver-bump"
Issues = "https://github.com/someone-rs/semver-bump/issues"

[project.scripts]
bump = "bump.cli:main"
semver-bump = "bump.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
